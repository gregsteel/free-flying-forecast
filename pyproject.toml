[project]
name = "ffforecast"
version = "0.1.0"
description = "Self-hosted soaring forecast for paraglider and hang glider pilots"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "xarray>=2024.10",
    "netCDF4>=1.7",
    "requests>=2.32",
    "Jinja2>=3.1",
    "eccodes>=2.49.0",
    "eccodeslib>=2.49.0.30",
]

[project.scripts]
ffforecast = "ffforecast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
